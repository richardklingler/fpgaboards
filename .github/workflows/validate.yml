# Every pull request and push: the packs' files must have the right format, ids and names
# (scripts/check_packs.py, Python standard library only). Whether every template places and
# builds on each board is checked with FPGALab by the maintainer before publishing; the index
# is signed and published on the maintainer's Mac, never here.
name: Check packs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check packs
        run: python3 scripts/check_packs.py packs
